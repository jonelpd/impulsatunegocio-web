name: Publicar web en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Verificar enlaces y archivos HTML
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if d.get('id'): self.ids.add(d['id'])
                  if tag=='a' and d.get('href'): self.links.append(d['href'])
          files=list(Path('.').glob('*.html'))+list(Path('portfolio').glob('*.html'))
          errors=[]
          for file in files:
              parser=Parser(); parser.feed(file.read_text(encoding='utf-8'))
              for href in parser.links:
                  url=urlsplit(href)
                  if url.scheme or url.netloc: continue
                  target=(file.parent/unquote(url.path)).resolve() if url.path else file.resolve()
                  if not target.is_file(): errors.append(f'{file}: archivo inexistente: {href}'); continue
                  if url.fragment and target.suffix=='.html':
                      other=Parser(); other.feed(target.read_text(encoding='utf-8'))
                      if unquote(url.fragment) not in other.ids: errors.append(f'{file}: ancla inexistente: {href}')
          if errors: raise SystemExit('\\n'.join(errors))
          print(f'Enlaces internos correctos en {len(files)} páginas HTML')
          PY
      - name: Verificar JavaScript y estructura HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.inline=[]; self.in_script=False; self.current=[]
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if attrs.get('id'): self.ids.append(attrs['id'])
                  if tag=='script' and not attrs.get('src'): self.in_script=True; self.current=[]
              def handle_data(self,data):
                  if self.in_script: self.current.append(data)
              def handle_endtag(self,tag):
                  if tag=='script' and self.in_script:
                      self.inline.append(''.join(self.current)); self.in_script=False
          errors=[]
          for file in [Path('index.html'),Path('en.html'),Path('crm-admin.html'),Path('crm-demo.html'),*Path('portfolio').glob('*.html')]:
              parser=Audit(); parser.feed(file.read_text(encoding='utf-8'))
              for item in set(parser.ids):
                  if parser.ids.count(item)>1: errors.append(f'{file}: id duplicado {item}')
              for n,script in enumerate(parser.inline):
                  result=subprocess.run(['node','--input-type=module','--check','-'],input=script,text=True,capture_output=True)
                  if result.returncode: errors.append(f'{file}: JavaScript {n+1}: {result.stderr}')
          if errors: raise SystemExit('\\n'.join(errors))
          print('Estructura HTML y JavaScript sin errores detectados')
          PY
      - name: Verificar accesos y traducción del CRM
        run: |
          python3 - <<'PY'
          from pathlib import Path
          crm=Path('crm-admin.html').read_text(encoding='utf-8')
          es=Path('index.html').read_text(encoding='utf-8')
          en=Path('en.html').read_text(encoding='utf-8')
          for code in ('es','en'):
              assert f'crm-admin.html?lang={code}' in crm, f'Missing CRM language link: {code}'
          assert 'crm-admin.html?lang=es' in es, 'Spanish site missing Spanish CRM link'
          assert 'crm-admin.html?lang=en' in en, 'English site missing English CRM link'
          assert "attributeFilter:['placeholder','title','aria-label']" in crm, 'Missing dynamic CRM attribute translation'
          assert "characterData:true" in crm, 'Missing dynamic CRM text translation'
          assert "client.from('crm_admins')" in crm, 'CRM admin authorization check missing'
          assert 'auth.signInWithPassword' in crm, 'CRM sign-in missing'
          assert 'auth.signOut' in crm, 'CRM sign-out missing'
          assert "data-view=\"dashboard\"" in crm and "data-view=\"agenda\"" in crm, 'CRM navigation incomplete'
          print('CRM: language links, authentication and translation hooks verified')
          PY
      - name: Verificar coherencia de configuradores y contacto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set(); self.labels=set(); self.controls={}
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if d.get('id'): self.ids.add(d['id'])
                  if tag=='label' and d.get('for'): self.labels.add(d['for'])
                  if tag in ('input','select','textarea') and d.get('id'): self.controls[d['id']]=tag
          expected={'projectType','contentState','features','businessSector','projectPages','projectTimeline','projectBudget','projectMaintenance','projectBusinessName','projectNotes','estimatePrice','estimateTitle','estimateText','prepareBrief','briefStatus','contactForm','name','email','message','sendByEmail','sendByWhatsApp','downloadBrief','contactSendOptions'}
          for path in ('index.html','en.html'):
              source=Path(path).read_text(encoding='utf-8')
              audit=Audit(); audit.feed(source)
              missing=expected-audit.ids
              assert not missing, f'{path}: missing project/contact controls: {sorted(missing)}'
              unlabeled=set(audit.controls)-audit.labels
              unlabeled={id for id in unlabeled if id in expected and id not in {'contactForm'}}
              assert not unlabeled, f'{path}: unlabeled controls: {sorted(unlabeled)}'
              for price in (('presentation',390,650),('business',790,1200),('catalogue',590,950),('store',1490,2800),('custom',1800,4500),('automation',350,1200)):
                  name,low,high=price
                  pattern=rf'{name}\s*:\s*(?:\{{[^}}]*?low:\s*{low},\s*high:\s*{high}|\[[^\]]*?,\s*{low},\s*{high},)'
                  assert re.search(pattern,source), f'{path}: unexpected base range for {name}'
              assert 'reportValidity()' in source, f'{path}: missing contact validation'
              assert 'encodeURIComponent(contactBrief())' in source or 'encodeURIComponent(getContactBrief())' in source, f'{path}: missing encoded contact draft'
              print(f'{path}: configurator and contact checks passed')
          PY
      - name: Preparar carpeta pública
        run: |
          mkdir -p _site/portfolio _site/assets
          cp index.html en.html crm-demo.html crm-admin.html _site/
          cp .nojekyll _site/
          cp portfolio/*.html _site/portfolio/
          cp assets/*.svg _site/assets/
      - name: Preparar archivos públicos
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
